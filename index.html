<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anger Management Bot</title>
<style>
:root{--ink:#1c1426;--gold:#f6c33b;--gold2:#e8b02a;--wall:#2f8f9d;--cream:#f4ebd3;--orange:#f2682b;--red:#d93a2b}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--gold);background-image:radial-gradient(var(--gold2) 24%,transparent 26%);background-size:13px 13px;color:var(--ink);font-family:"Arial Black","Arial Bold",Impact,Helvetica,sans-serif;display:flex;flex-direction:column;align-items:center;padding:16px 12px 26px}
h1{margin:0;font-size:clamp(28px,7.5vw,50px);line-height:1;text-transform:uppercase;color:var(--cream);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink);transform:rotate(-1.5deg)}
.sub{margin:12px 0 14px;font:700 15px/1.3 Arial,Helvetica,sans-serif;background:var(--cream);border:3px solid var(--ink);padding:4px 12px;box-shadow:3px 3px 0 var(--ink)}
.frame{position:relative;width:min(100%,680px);border:5px solid var(--ink);box-shadow:7px 7px 0 var(--ink);overflow:hidden;background:var(--wall)}
svg{display:block;width:100%;height:auto}
svg *{stroke:var(--ink);stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
svg .n{stroke:none}
svg .f{fill:none}
.bubble{position:absolute;left:4%;top:6%;max-width:46%;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px 10px;font:700 clamp(11px,2.6vw,15px)/1.25 Arial,Helvetica,sans-serif;box-shadow:3px 3px 0 var(--ink);transition:opacity .25s}
.bubble:after{content:"";position:absolute;left:70%;bottom:-13px;width:14px;height:14px;background:#fff;border:3px solid var(--ink);border-width:0 3px 3px 0;transform:rotate(45deg) skew(10deg,10deg)}
.banner{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:clamp(36px,12vw,86px);color:var(--gold);-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:5px 5px 0 var(--ink);transform:rotate(-5deg) scale(0);pointer-events:none}
.done .banner{animation:pop .5s cubic-bezier(.3,1.6,.5,1) forwards}
.hud{display:flex;align-items:center;gap:10px;width:min(100%,680px);margin:16px 0 4px;font:700 15px Arial,Helvetica,sans-serif}
.bar{flex:1;height:22px;border:4px solid var(--ink);background:var(--cream);box-shadow:3px 3px 0 var(--ink);overflow:hidden}
#fill{height:100%;width:100%;background:#47b35a;transition:width .4s,background .4s}
.btns{display:flex;gap:14px;align-items:center;margin-top:12px;flex-wrap:wrap;justify-content:center}
button{font:inherit;text-transform:uppercase;color:var(--ink);border:5px solid var(--ink);border-radius:50px;cursor:pointer;transition:transform .06s,box-shadow .06s}
#go{font-size:26px;padding:14px 38px;background:var(--red);color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;box-shadow:0 8px 0 var(--ink)}
#go:active{transform:translateY(8px);box-shadow:0 0 0 var(--ink)}
#calm{font-size:17px;padding:10px 22px;background:var(--cream);box-shadow:0 5px 0 var(--ink)}
#calm:active:not(:disabled){transform:translateY(5px);box-shadow:none}
#calm:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible{outline:4px dashed var(--ink);outline-offset:5px}
#msg{margin:10px 0 0;font-size:17px;text-align:center;min-height:22px}
.foot{margin-top:16px;font:700 14px Arial,Helvetica,sans-serif;background:var(--cream);border:3px solid var(--ink);padding:3px 10px}
/* rig */
#uL{transform-origin:165px 172px}#fL{transform-origin:165px 208px}
#uR{transform-origin:235px 172px}#fR{transform-origin:235px 208px}
#fL{transform:rotate(37deg)}#fR{transform:rotate(-59deg)}
#uL,#uR,#fL,#fR{transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
#mug,#laptop,#chB,#chS{transform-box:fill-box;transform-origin:center}
#desk{transform-origin:370px 296px}
#head{transform-origin:200px 140px}
.pu{transition:transform .2s}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
#lidA,#lidB,#mF,#mA{display:none}
.c1 #lidA,.c1 #mF{display:block}.c1 #mS,.c2 #mS,.g2 #mS{display:none}
.g2 #lidB,.g2 #mA{display:block}.g2 #lidA,.g2 #mF{display:none}
.look .pu{animation:look 1.8s}
.c0 #fR{animation:typeR .28s steps(1) infinite}
.c0 #fL{animation:typeL .37s steps(1) infinite}
.stretch #uL{animation:strL 1.5s}.stretch #uR{animation:strR 1.5s}
/* 1: hands through hair */
.c1 #uL{transform:rotate(141deg)}.c1 #uR{transform:rotate(-141deg)}
.c1 #fL{animation:rubL .28s infinite alternate}.c1 #fR{animation:rubR .28s infinite alternate}
.c1 #head{animation:hshake .5s infinite}
/* 2: pounding the table */
.c2 #uL{animation:pUL .36s infinite}.c2 #fL{animation:pFL .36s infinite}
.c2 #uR{animation:pUR .36s infinite}.c2 #fR{animation:pFR .36s infinite}
.c2 #desk{animation:bump .36s infinite}.c2 #mug{animation:mhop .36s infinite}
.c2 #head{animation:hshake .3s infinite}
/* 3: coffee */
.c3 #uL{animation:thL .9s forwards}.c3 #fL{animation:thFL .9s forwards}
.g3 #mug{animation:mugfly 1.2s .35s ease-out forwards}
/* 4: laptop */
.c4 #uR{animation:thR .9s forwards}.c4 #fR{animation:thFR .9s forwards}
.g4 #laptop{animation:lapfly 1.2s .35s ease-out forwards}
.g3 #fL,.g3 #fR{transform:rotate(12deg)}.g3 #fR{transform:rotate(-12deg)}
.g3 #uL{transform:rotate(14deg)}.g3 #uR{transform:rotate(-14deg)}
.g3 #robot{animation:breathe .5s infinite alternate}
/* 5: desk flip */
.c5 #uL{animation:heL 1s forwards}.c5 #uR{animation:heR 1s forwards}
.g5 #desk{animation:flip 1.1s .3s cubic-bezier(.5,0,.8,.6) forwards}
/* 6: chair finale (f1 freeze, f2 lift, f3 throw, f4 aftermath) */
.f1 #robot{animation:none}.f1 #head{animation:hshake .1s infinite}
.f2 #uL{transform:rotate(165deg)}.f2 #uR{transform:rotate(-165deg)}
.f2 #fL{transform:rotate(15deg)}.f2 #fR{transform:rotate(-15deg)}
.f3 #uL{transform:rotate(25deg)}.f3 #uR{transform:rotate(-25deg)}
#robot{transition:transform .2s;transform-origin:200px 276px}
.f3 #robot{transform:rotate(-5deg)}.f4 #robot{animation:none}
.f4 #head{animation:none;transform:rotate(-6deg)}
#chair,.pc,#burst,#sign{transform-box:fill-box;transform-origin:center}
#sign{transform-origin:50% 0}
#laptop,#mug,#head{cursor:pointer}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.pop{position:absolute;top:36%;font:900 clamp(18px,5vw,30px) "Arial Black",Arial,sans-serif;color:var(--gold);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;pointer-events:none;animation:rise 1s forwards}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-70px);opacity:0}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes look{20%,50%{transform:translateX(-4px)}70%,90%{transform:translateX(4px)}}
@keyframes typeR{50%{transform:rotate(-50deg)}}@keyframes typeL{50%{transform:rotate(31deg)}}
@keyframes strL{40%,60%{transform:rotate(160deg)}}@keyframes strR{40%,60%{transform:rotate(-160deg)}}
@keyframes rubL{from{transform:rotate(60deg)}to{transform:rotate(84deg)}}
@keyframes rubR{from{transform:rotate(-60deg)}to{transform:rotate(-84deg)}}
@keyframes hshake{50%{transform:rotate(3deg)}0%,100%{transform:rotate(-3deg)}}
@keyframes pUL{0%,100%{transform:rotate(105deg)}45%{transform:rotate(0)}}
@keyframes pFL{0%,100%{transform:rotate(25deg)}45%{transform:rotate(37deg)}}
@keyframes pUR{0%,100%{transform:rotate(-105deg)}45%{transform:rotate(0)}}
@keyframes pFR{0%,100%{transform:rotate(-25deg)}45%{transform:rotate(-59deg)}}
@keyframes bump{45%{transform:translateY(5px)}}
@keyframes mhop{40%{transform:translateY(-9px)}}
@keyframes thL{0%{transform:rotate(0)}25%{transform:rotate(-35deg)}55%{transform:rotate(135deg)}100%{transform:rotate(14deg)}}
@keyframes thFL{0%{transform:rotate(37deg)}25%{transform:rotate(-20deg)}55%{transform:rotate(20deg)}100%{transform:rotate(12deg)}}
@keyframes thR{0%{transform:rotate(0)}25%{transform:rotate(35deg)}55%{transform:rotate(-135deg)}100%{transform:rotate(-14deg)}}
@keyframes thFR{0%{transform:rotate(-59deg)}25%{transform:rotate(20deg)}55%{transform:rotate(-20deg)}100%{transform:rotate(-12deg)}}
@keyframes mugfly{50%{transform:translate(-130px,-130px) rotate(-320deg)}100%{transform:translate(-300px,60px) rotate(-640deg);opacity:0}}
@keyframes lapfly{50%{transform:translate(130px,-140px) rotate(280deg)}100%{transform:translate(300px,70px) rotate(560deg);opacity:0}}
@keyframes breathe{to{transform:translateY(2px)}}
@keyframes heL{0%{transform:rotate(14deg)}40%{transform:rotate(158deg)}100%{transform:rotate(20deg)}}
@keyframes heR{0%{transform:rotate(-14deg)}40%{transform:rotate(-158deg)}100%{transform:rotate(-20deg)}}
@keyframes flip{55%{transform:rotate(100deg)}75%{transform:rotate(86deg)}100%{transform:rotate(94deg)}}
@keyframes chB{50%{transform:translate(-150px,-130px) rotate(-240deg)}100%{transform:translate(-330px,60px) rotate(-440deg);opacity:0}}
@keyframes chS{50%{transform:translate(120px,-110px) rotate(200deg)}100%{transform:translate(300px,80px) rotate(420deg);opacity:0}}
@keyframes hop{50%{transform:translateY(-16px)}}
@keyframes pop{to{transform:rotate(-5deg) scale(1)}}
@media (prefers-reduced-motion:reduce){.eye,.c0 #fR,.c0 #fL{animation:none}}
.ctl{display:flex;flex-direction:column;align-items:center;width:min(100%,680px)}
.hide{display:none!important}
.sm{font-size:15px;padding:8px 18px;background:var(--cream);box-shadow:0 4px 0 var(--ink)}
.sm:active{transform:translateY(4px);box-shadow:none}
#chaosBtn{font-size:20px;padding:12px 26px;background:var(--red);color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;box-shadow:0 6px 0 var(--ink)}
#chaosBtn:active{transform:translateY(6px);box-shadow:none}
#mood{margin-top:14px;font:700 15px Arial,Helvetica,sans-serif;background:var(--cream);border:3px solid var(--ink);padding:3px 10px}
.lvl{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;margin:6px 0;background:var(--cream);border:3px solid var(--ink);padding:8px 12px;box-shadow:3px 3px 0 var(--ink);font:700 15px Arial,Helvetica,sans-serif}
.lvl.off{opacity:.55}
#levels .sm{margin-top:8px}
#clock{cursor:pointer}
.irr #lidA,.irr #mF{display:block}.irr #mS{display:none}
.irr.c0 #fR{animation-duration:.15s}.irr.c0 #fL{animation-duration:.2s}
.alt-only{display:none}.alt .alt-only{display:block}
.alt [fill="var(--cream)"]{fill:#e3f4ef}.alt [fill="var(--orange)"]{fill:#1b8f86}
.alt [fill="#e5dbc0"]{fill:#cfe7e2}.alt [fill="#d9531c"]{fill:#14706a}
.alt [fill="#ffcf1f"]{fill:#ff6f61}.alt [fill="#f0b90f"]{fill:#e85a4c}
#mS,#mF,#mA{stroke:#5ff2ff;stroke-width:3}
.sm.on{background:var(--gold)}
</style>
</head>
<body>

<p class="sub">A small office worker. Click things. He has opinions.</p>

<div class="frame" id="frame">

  <rect x="176" y="214" width="20" height="60" rx="6" fill="#e5dbc0"/><rect x="204" y="214" width="20" height="60" rx="6" fill="#e5dbc0"/>

    <g id="fL"><rect x="158" y="206" width="14" height="34" rx="7" fill="#e5dbc0"/><circle cx="165" cy="246" r="10" fill="var(--orange)"/><circle cx="165" cy="208" r="7" fill="#8f8a9c"/></g></g>
  <rect x="158" y="146" width="84" height="74" rx="20" fill="var(--cream)"/>

  <path d="M160 166 L190 150 L190 218 H168 Z" fill="var(--orange)"/><path d="M240 166 L210 150 L210 218 H232 Z" fill="var(--orange)"/>
  <path class="f" d="M174 190 L188 190 M212 190 L226 190" style="stroke:#ffe36b;stroke-width:5"/>

  <g class="alt-only"><rect x="158" y="202" width="84" height="12" fill="#8b5a2b"/><rect x="192" y="199" width="16" height="18" rx="3" fill="#f6c33b"/><rect x="164" y="212" width="10" height="14" rx="2" fill="#bdbdbd"/></g><circle cx="194" cy="174" r="4" fill="#5ff2ff" class="n"/><circle cx="206" cy="174" r="4" fill="#ffd44d" class="n"/>

    <circle cx="163" cy="106" r="8" fill="var(--orange)"/><circle cx="237" cy="106" r="8" fill="var(--orange)"/>

    <rect x="166" y="76" width="68" height="62" rx="24" fill="var(--cream)"/>
    <path class="f" d="M174 92 Q172 84 180 82" style="stroke:#fff"/>

    <g class="pu"><g class="n"><ellipse class="eye" cx="189" cy="106" rx="7" ry="9" fill="#5ff2ff"/><ellipse class="eye" cx="211" cy="106" rx="7" ry="9" fill="#5ff2ff"/>

</g>

</svg>
<div id="flash"></div><div class="bubble" id="bubble"></div>
<div class="banner" aria-live="polite">I'M DONE!!</div>
</div>

<div id="homeCtl" class="ctl">
<div class="btns" style="margin-top:4px"><button class="sm" id="pickA" type="button">Winston</button><button class="sm" id="pickB" type="button">Darla</button></div>
<div id="mood">Mood: calm</div>
<div class="btns"><button class="sm" id="coffee" type="button">Offer coffee</button><button class="sm" id="brk" type="button">Take a break</button><button id="chaosBtn" type="button">Chaos Mode</button></div>
</div>
<div id="levels" class="ctl hide">
<div class="lvl"><b>Level 1: Inbox Inferno</b><button class="sm" id="play1" type="button">Play</button></div>
<div class="lvl off"><b>Level 2: This Could Have Been an Email</b><span>Coming soon</span></div>
<div class="lvl off"><b>Level 3: The Conversation Trap</b><span>Coming soon</span></div>
<button class="sm" id="back" type="button">Back to office</button>
</div>
<div id="chaos" class="ctl hide">
<div class="hud"><span>Patience</span><div class="bar"><div id="fill"></div></div></div>
<div class="hud"><span id="score">Score 0</span><span id="combo">x1</span><span id="best" style="margin-left:auto">Best 0</span></div>
<div id="msg"></div>
<div class="btns"><button id="go" type="button">Push</button><button id="calm" type="button">Breathe</button><button class="sm" id="exit" type="button">Exit to office</button></div>
</div>
<div class="btns"><div class="foot" style="margin:0">Incidents: <span id="count">0</span></div><button class="sm" id="snd" type="button">Sound: on</button></div>

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
